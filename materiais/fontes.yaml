# Fontes da base de dados dos materiais.
# Cada registro de registros.csv aponta para uma destas chaves (fonte_id).
# Os PDFs não são versionados (direitos autorais); use as URLs.

hitachi_finemet_2010:
  referencia: >-
    HITACHI METALS. Nanocrystalline soft magnetic material FINEMET.
    Catálogo HL-FM9-E, jul. 2010.
  url: https://www.hilltech.com/pdf/Hitachi/Datasheets/Hitachi%20Metals%20FINEMET%20material_sm.pdf
  tipo: catalogo_fabricante
  acesso: "2026-10-02"
  observacoes: >-
    Hitachi Metals é hoje Proterial. A tabela da p. 6 compara os graus FINEMET
    com materiais convencionais, todos medidos pela Hitachi Metals em núcleos
    toroidais sem corte.

metglas_2705m_2014:
  referencia: >-
    METGLAS INC. Magnetic Alloy 2705M (cobalt-based): Technical Bulletin,
    ref. 2705M08202014, 2014.
  url: https://metglas.com/wp-content/uploads/2016/12/2705M-Technical-Bulletin.pdf
  tipo: ficha_tecnica
  acesso: "2026-10-02"
  observacoes: >-
    Traz também curvas de magnetização inicial (p. 2) e laço de histerese DC
    (p. 1) em figura, a digitalizar.

vac_pht001_2002:
  referencia: >-
    VACUUMSCHMELZE. Soft Magnetic Materials and Semi-finished Products,
    PHT-001, ed. 2002.
  url: https://vacuumschmelze.com/03_Documents/Brochures/Product%20Information%20Soft%20Magnetic%20Materials%20and%20Semi-Finished%20Products.pdf
  tipo: catalogo_fabricante
  acesso: "2026-10-02"
  observacoes: >-
    Valores médios medidos em núcleos toroidais. A tabela 9 (p. 19) traz as
    propriedades dinâmicas a 50 Hz; a tabela da p. 22, as físicas.

vac_vitroperm_emc_2016:
  referencia: >-
    VACUUMSCHMELZE. Nanocrystalline VITROPERM: EMC Products, 2016.
  url: https://gmw.com/wp-content/uploads/2019/03/NanocrystallineVITROPERM-EMC-Products-2016_01.pdf
  tipo: catalogo_fabricante
  acesso: "2026-10-02"

tdk_n87_2025:
  referencia: >-
    TDK ELECTRONICS. Ferrites and accessories: SIFERRIT material N87.
    Data sheet, jun. 2025.
  url: https://www.tdk-electronics.tdk.com/download/528882/990c299b916e9f3eb7e44ad563b7f0b9/pdf-n87.pdf
  tipo: ficha_tecnica
  acesso: "2026-10-02"

shen2026:
  referencia: >-
    SHEN, P. et al. Fe-based nanocrystalline magnetic shielding cylinder with
    subfemtotesla-level magnetic noise. Advanced Science, v. 13, n. 17,
    art. e22435, 2026. DOI: 10.1002/advs.202522435.
  tipo: artigo
  observacoes: >-
    Valores transcritos da revisão interna de materiais (v3.0), ainda não
    conferidos no artigo original.

qian2026:
  referencia: >-
    QIAN, Y. et al. Exceptional magnetic shielding via ultra-low-remanence
    Co-based amorphous alloys engineered by atomic ordering. Materials
    Research Letters, v. 14, n. 7, p. 792-801, 2026.
    DOI: 10.1080/21663831.2026.2660809.
  tipo: artigo
  observacoes: >-
    Valores transcritos da revisão interna de materiais (v3.0), ainda não
    conferidos no artigo original.

liuX2025:
  referencia: >-
    LIU, X. et al. Fe2O3 composition optimization for MnZn ferrite and its
    magnetic noise evaluation for low-frequency magnetic shielding
    applications. Journal of Alloys and Compounds, v. 1035, art. 181418, 2025.
    DOI: 10.1016/j.jallcom.2025.181418.
  tipo: artigo
  observacoes: >-
    Valores transcritos da revisão interna de materiais (v3.0), ainda não
    conferidos no artigo original.

metglas_site_2026:
  referencia: >-
    METGLAS INC. Magnetic Materials (especificações das ligas). Página do
    fabricante.
  url: https://metglas.com/magnetic-materials/
  tipo: pagina_fabricante
  acesso: "2026-10-02"

liang2026:
  referencia: >-
    LIANG, Y. et al. Multi-layer magnetic shields based on Fe-based
    nanocrystalline and Co-based amorphous ribbons. Materials, v. 19, n. 10,
    art. 1986, 2026. DOI: 10.3390/ma19101986.
  url: https://doi.org/10.3390/ma19101986
  tipo: artigo
  acesso: "2026-10-09"
  observacoes: >-
    Acesso aberto (CC BY). Tabela 1 (p. 5): permeabilidades inicial e máxima,
    Bs e Hc das fitas FN e CA; a condição de medição não é declarada. Fig. 3
    (p. 5): SEmax de cilindros de 1 a 3 camadas (70 mm x 300 mm), dado de
    validação.

kornack2007:
  referencia: >-
    KORNACK, T. W.; SMULLIN, S. J.; LEE, S.-K.; ROMALIS, M. V. A low-noise
    ferrite magnetic shield. Applied Physics Letters, v. 90, n. 22, art.
    223501, 2007. DOI: 10.1063/1.2737357.
  url: https://doi.org/10.1063/1.2737357
  tipo: artigo
  acesso: "2026-10-09"
  observacoes: >-
    Versão de acesso aberto (arXiv) usada na leitura. Permeabilidade complexa
    da ferrita MN80 medida por impedância de quatro pontos (p. 3).

msc_mumetal_chapa:
  referencia: >-
    MAGNETIC SHIELD CORPORATION. MuMETAL stress annealed sheet: data sheet.
    Bensenville, IL, 2020.
  url: https://www.magnetic-shield.com/content/MuMetal%20Stress%20Annealed%20Sheet%20Data.pdf
  tipo: ficha_tecnica
  acesso: "2026-10-09"
  observacoes: >-
    Valores típicos, não garantidos; magnéticos medidos em anéis estampados
    de chapa de 0,35 mm após recozimento final (perfection anneal).

msc_mumetal_folha:
  referencia: >-
    MAGNETIC SHIELD CORPORATION. MuMETAL fully annealed foil: data sheet.
    Bensenville, IL, 2020.
  url: https://www.magnetic-shield.com/content/MuMetal%20Fully%20Annealed%20Foil%20Data.pdf
  tipo: ficha_tecnica
  acesso: "2026-10-09"
  observacoes: >-
    Valores típicos; magnéticos medidos em toroide de folha de 0,1 mm após
    recozimento final.

msc_conetic_aa:
  referencia: >-
    MAGNETIC SHIELD CORPORATION. Co-NETIC AA stress annealed sheet: data
    sheet. Bensenville, IL, 2020.
  url: https://www.magnetic-shield.com/content/Co-NETIC%20AA%20Stress%20Annealed%20Sheet%20Data.pdf
  tipo: ficha_tecnica
  acesso: "2026-10-09"
  observacoes: >-
    Valores típicos; magnéticos medidos em anéis estampados de chapa de 0,35
    mm após recozimento final.

metglas_2714a_2011:
  referencia: >-
    METGLAS INC. Magnetic Alloy 2714A (cobalt-based): Technical Bulletin,
    ref. 2714A04202011, 2011.
  url: https://metglas.com/wp-content/uploads/2016/12/2714A-Technical-Bulletin.pdf
  tipo: ficha_tecnica
  acesso: "2026-10-09"
  observacoes: >-
    Tabelas de propriedades físicas e magnéticas na p. 1.

vac_vitroperm_800_500_2024:
  referencia: >-
    VACUUMSCHMELZE. VITROPERM 800 / 500: datasheet. Hanau, 2024.
  url: https://www.vacuumschmelze.com/03_Documents/Brochures/Datasheet%20VITROPERM%20500%20-%20800.pdf
  tipo: ficha_tecnica
  acesso: "2026-10-09"
  observacoes: >-
    Valores típicos, não fazem parte de especificação (nota 1 da ficha).
    VITROPERM 800 e 500 são a mesma liga (VP 800).

ferroxcube_3e6_2002:
  referencia: >-
    FERROXCUBE. 3E6 material specification: data sheet, 2002 Feb 01.
  url: https://sy-dep-epc-lpc.web.cern.ch/components/datasheets/epc-lpc%20(converters)/3E6%20MATERIAL%20(FERROXCUBE).pdf
  tipo: ficha_tecnica
  acesso: "2026-10-09"
  observacoes: >-
    Cópia hospedada pelo CERN; medido em núcleos toroidais Ø14 x Ø9 x 5 mm
    sinterizados, sem retífica. Conferir se a Ferroxcube publicou revisão
    mais nova.

cmi_mn80_2019:
  referencia: >-
    CERAMIC MAGNETICS INC. MN80 Mn-Zn power ferrite: typical properties.
    Bethlehem, PA, 2019.
  url: https://www.magneticsgroup.com/wp-content/uploads/2019/09/MN80-ISO-WEB-DATA.pdf
  tipo: ficha_tecnica
  acesso: "2026-10-09"
  observacoes: >-
    Ensaios a 10 kHz e 22 °C; Bs a 1 kHz e 20 Oe; Br e Hc a 1 kHz e 5 Oe. A
    Ceramic Magnetics hoje faz parte do Magnetics Group.

cmi_mn60_2019:
  referencia: >-
    CERAMIC MAGNETICS INC. MN60 general purpose, high permeability Mn-Zn
    ferrite: typical properties. Bethlehem, PA, 2019.
  url: https://www.magneticsgroup.com/wp-content/uploads/2019/09/MN60-ISO-WEB-DATA.pdf
  tipo: ficha_tecnica
  acesso: "2026-10-09"
  observacoes: >-
    Ensaios a 10 kHz e 22 °C; Bs a 20 Oe; Br e Hc a 5 Oe. A ficha cita
    blindagem entre as aplicações.

mil_n_14411c_1977:
  referencia: >-
    UNITED STATES. Department of Defense. MIL-N-14411C: Nickel-iron alloy,
    high magnetic permeability sheet, strip, rod, bar, and wire. 23 nov.
    1977.
  url: https://everyspec.com/MIL-SPECS/MIL-SPECS-MIL-N/MIL-N-14411C_42250/
  tipo: norma
  acesso: "2026-10-09"
  observacoes: >-
    Especificação pública. Tabela I (p. 2): composição; Tabela III (p. 5):
    mínimos DC; Tabela IV (p. 6): mínimos AC a 60 Hz por espessura. MuMETAL
    e Co-NETIC declaram atender à Composição 1. ASTM A753 e IEC 60404-8-6
    são pagas e não foram consultadas.
